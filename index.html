<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心适配：确保移动端正确渲染 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TagBox - 安全标签管理 (移动端优化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础重置 */
        body { -webkit-tap-highlight-color: transparent; }
        
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 登录遮罩层动画 */
        #auth-overlay {
            display: none; 
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        #auth-overlay.show {
            display: flex;
            opacity: 1;
        }

        /* 弹窗背景模糊 */
        .backdrop-blur-custom { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        
        /* 辅助类 */
        .hidden-important { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen relative overflow-x-hidden">

    <!-- 1. 密码验证遮罩层 -->
    <div id="auth-overlay" class="fixed inset-0 z-50 bg-gray-900/90 backdrop-blur-custom items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm fade-in border border-gray-200">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-shield-halved text-xl text-indigo-600"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-900">安全验证</h2>
                <p class="text-gray-500 mt-1 text-xs">请输入密码解锁 TagBox</p>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div class="relative">
                    <input type="password" id="auth-password" 
                           class="block w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm" 
                           placeholder="输入密码..." autocomplete="current-password" autofocus>
                </div>
                
                <div id="auth-error" class="text-red-500 text-xs text-center hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> 密码错误
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-transform">
                    解锁
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 主应用内容 -->
    <div id="app-content" class="hidden-important flex flex-col min-h-screen w-full">
        <!-- 头部 -->
        <header class="bg-white shadow-sm sticky top-0 z-20 border-b border-gray-100">
            <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 bg-indigo-600 rounded-md flex items-center justify-center text-white">
                        <i class="fa-solid fa-tags text-xs"></i>
                    </div>
                    <h1 class="text-lg font-bold text-gray-900">TagBox</h1>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="exportData()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                        <i class="fa-solid fa-file-export"></i>
                    </button>
                    <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm flex items-center">
                        <i class="fa-solid fa-plus mr-1"></i> 新建
                    </button>
                    <button onclick="logout()" class="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="flex-grow max-w-7xl mx-auto px-4 py-4 w-full">
            <!-- 筛选与搜索 (移动端优化：垂直堆叠) -->
            <div class="mb-4 flex flex-col gap-3">
                <!-- 分类按钮：允许横向滑动 -->
                <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1" id="category-filters">
                    <button onclick="filterByCategory('all')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap shrink-0" data-category="all">全部</button>
                    <button onclick="filterByCategory('work')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap shrink-0" data-category="work">工作</button>
                    <button onclick="filterByCategory('study')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap shrink-0" data-category="study">学习</button>
                    <button onclick="filterByCategory('life')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap shrink-0" data-category="life">生活</button>
                </div>
                
                <!-- 搜索框：全宽 -->
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs"></i>
                    </div>
                    <input type="text" id="search-input" class="block w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg bg-white text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="搜索标签、备注或链接...">
                </div>
            </div>

            <!-- 标签网格 (移动端单列，平板双列，桌面三列) -->
            <div id="tags-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 动态内容 -->
            </div>
            
            <!-- 空状态 -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
                <i class="fa-regular fa-folder-open text-3xl text-gray-300 mb-2"></i>
                <p class="text-gray-500 text-xs">暂无数据</p>
            </div>
        </main>
    </div>

    <!-- 模态框 (移动端优化：限制高度，内部滚动) -->
    <div id="tag-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end sm:items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <!-- 背景遮罩 -->
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeModal()"></div>
            
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            
            <!-- 弹窗内容 -->
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full max-h-[90vh] flex flex-col">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 overflow-y-auto flex-grow">
                    <h3 class="text-lg font-medium text-gray-900 mb-4" id="modal-title">编辑标签</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">内容</label>
                            <input type="text" id="tag-content" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="标签名称">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">链接 (可选)</label>
                            <input type="url" id="tag-url" class="w-full border border-gray-300 rounded px-3 py-2 text-sm" placeholder="https://...">
                        </div>
                        <div class="flex gap-4">
                            <div class="w-1/2">
                                <label class="block text-xs font-medium text-gray-700 mb-1">分类</label>
                                <select id="tag-category" class="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-white">
                                    <option value="work">工作</option>
                                    <option value="study">学习</option>
                                    <option value="life">生活</option>
                                </select>
                            </div>
                            <div class="w-1/2">
                                <label class="block text-xs font-medium text-gray-700 mb-1">颜色</label>
                                <div class="flex items-center border border-gray-300 rounded px-2 py-1.5 bg-white">
                                    <input type="color" id="tag-color" class="w-6 h-6 rounded cursor-pointer border-none p-0" value="#4F46E5">
                                    <span class="ml-2 text-xs text-gray-500">选择颜色</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">备注</label>
                            <textarea id="tag-note" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 text-sm" placeholder="添加备注信息..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-100">
                    <button onclick="saveTag()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:ml-3 sm:w-auto sm:text-sm">保存</button>
                    <button onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-white border-l-4 border-green-500 shadow-lg rounded p-4 flex items-center max-w-[90vw]">
        <i class="fa-solid fa-check-circle text-green-500 mr-2"></i>
        <span id="toast-message" class="text-sm font-medium">成功</span>
    </div>

    <script>
        // --- 核心逻辑 ---
        const STORED_HASH = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92"; // 123456
        let tags = [];
        let currentFilter = 'all';
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        function checkAuth() {
            const isAuthed = sessionStorage.getItem('tagbox_auth');
            const overlay = document.getElementById('auth-overlay');
            const appContent = document.getElementById('app-content');

            if (isAuthed === 'true') {
                overlay.classList.remove('show');
                appContent.classList.remove('hidden-important');
                loadTags();
                renderTags();
            } else {
                overlay.classList.add('show');
                appContent.classList.add('hidden-important');
                setTimeout(() => document.getElementById('auth-password').focus(), 50);
            }
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const inputPwd = document.getElementById('auth-password').value;
            const errorDiv = document.getElementById('auth-error');
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;

            const inputHash = await sha256(inputPwd);

            setTimeout(() => {
                if (inputHash === STORED_HASH) {
                    sessionStorage.setItem('tagbox_auth', 'true');
                    errorDiv.classList.add('hidden');
                    const overlay = document.getElementById('auth-overlay');
                    const appContent = document.getElementById('app-content');
                    
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.classList.remove('show');
                        appContent.classList.remove('hidden-important');
                        loadTags();
                        renderTags();
                    }, 300);
                } else {
                    errorDiv.classList.remove('hidden');
                    document.getElementById('auth-password').value = '';
                    document.getElementById('auth-password').focus();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, 300);
        }

        function logout() {
            sessionStorage.removeItem('tagbox_auth');
            location.reload();
        }

        // --- 业务逻辑 ---
        function loadTags() {
            const stored = localStorage.getItem('tagbox_data');
            tags = stored ? JSON.parse(stored) : [];
        }

        function renderTags() {
            const container = document.getElementById('tags-container');
            const emptyState = document.getElementById('empty-state');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            container.innerHTML = '';
            
            const filtered = tags.filter(t => {
                const matchCat = currentFilter === 'all' || t.category === currentFilter;
                const contentMatch = t.content.toLowerCase().includes(searchVal);
                const noteMatch = t.note ? t.note.toLowerCase().includes(searchVal) : false;
                const urlMatch = t.url ? t.url.toLowerCase().includes(searchVal) : false;
                return matchCat && (contentMatch || noteMatch || urlMatch);
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                filtered.forEach(tag => {
                    const div = document.createElement('div');
                    div.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition group fade-in';
                    const hasUrl = tag.url && tag.url.startsWith('http');
                    
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex items-center space-x-3 overflow-hidden flex-grow">
                                <div class="w-1.5 h-10 rounded-full shrink-0" style="background:${tag.color}"></div>
                                <div class="min-w-0">
                                    ${hasUrl 
                                        ? `<a href="${tag.url}" target="_blank" class="font-semibold text-gray-800 hover:text-indigo-600 truncate block">${tag.content} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-gray-400"></i></a>`
                                        : `<div class="font-semibold text-gray-800 truncate">${tag.content}</div>`
                                    }
                                    <div class="text-xs text-gray-400 mt-1 flex items-center gap-2">
                                        <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px]">${tag.category}</span>
                                        <span>${new Date(tag.createdAt).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="opacity-100 sm:opacity-0 group-hover:opacity-100 flex space-x-2 shrink-0 ml-2">
                                <button onclick="editTag(${tag.id})" class="text-gray-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteTag(${tag.id})" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        ${tag.note ? `<p class="mt-2 text-xs text-gray-500 line-clamp-2 bg-gray-50 p-2 rounded border border-gray-100">${tag.note}</p>` : ''}
                        <button onclick="copyToClipboard('${hasUrl ? tag.url.replace(/'/g, "\\'") : tag.content.replace(/'/g, "\\'")}')" class="mt-3 w-full text-xs bg-gray-50 hover:bg-indigo-50 text-gray-600 py-2 rounded border border-gray-100 transition flex items-center justify-center active:bg-indigo-100">
                            <i class="fa-regular fa-copy mr-1.5"></i> ${hasUrl ? '复制链接' : '复制内容'}
                        </button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function openModal(isEdit = false) {
            document.getElementById('tag-modal').classList.remove('hidden');
            if(!isEdit) {
                document.getElementById('tag-content').value = '';
                document.getElementById('tag-url').value = '';
                document.getElementById('tag-note').value = '';
                editingId = null;
            }
        }
        function closeModal() { document.getElementById('tag-modal').classList.add('hidden'); }
        
        function saveTag() {
            const content = document.getElementById('tag-content').value;
            if(!content) return alert('内容不能为空');
            
            const newTag = {
                id: editingId || Date.now(),
                content: content,
                url: document.getElementById('tag-url').value,
                category: document.getElementById('tag-category').value,
                color: document.getElementById('tag-color').value,
                note: document.getElementById('tag-note').value,
                createdAt: editingId ? tags.find(t=>t.id===editingId).createdAt : Date.now()
            };

            if(editingId) {
                const idx = tags.findIndex(t => t.id === editingId);
                tags[idx] = newTag;
            } else {
                tags.push(newTag);
            }
            localStorage.setItem('tagbox_data', JSON.stringify(tags));
            renderTags();
            closeModal();
        }

        function editTag(id) {
            const t = tags.find(x => x.id === id);
            editingId = id;
            document.getElementById('tag-content').value = t.content;
            document.getElementById('tag-url').value = t.url || '';
            document.getElementById('tag-category').value = t.category;
            document.getElementById('tag-color').value = t.color;
            document.getElementById('tag-note').value = t.note || '';
            openModal(true);
        }

        function deleteTag(id) {
            if(confirm('确定删除？')) {
                tags = tags.filter(t => t.id !== id);
                localStorage.setItem('tagbox_data', JSON.stringify(tags));
                renderTags();
            }
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.dataset.category === cat) {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm whitespace-nowrap shrink-0";
                } else {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap shrink-0";
                }
            });
            renderTags();
        }

        document.getElementById('search-input').addEventListener('input', renderTags);

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2000);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tags));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "tags_backup.json";
            a.click();
        }
    </script>
</body>
</html>
