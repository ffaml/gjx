
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagBox - 智能标签管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c7c7c7; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        
        /* 动画效果 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 链接悬停效果 */
        .tag-link:hover {
            text-decoration: underline;
            color: #4F46E5;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- 头部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-tags"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">TagBox</h1>
            </div>
            <div class="flex items-center space-x-4">
                <!-- 仅保留一个主要的导出按钮，样式更简洁 -->
                <button onclick="exportData()" class="text-gray-500 hover:text-indigo-600 transition p-2 rounded-full hover:bg-indigo-50" title="导出数据">
                    <i class="fa-solid fa-file-export text-lg"></i>
                </button>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md hover:shadow-lg flex items-center">
                    <i class="fa-solid fa-plus mr-2"></i> 新建标签
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- 控制栏：搜索与筛选 -->
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <!-- 分类筛选 -->
            <div class="flex space-x-2 overflow-x-auto pb-2 md:pb-0 no-scrollbar" id="category-filters">
                <button onclick="filterByCategory('all')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-100 text-indigo-700 border border-indigo-200 transition whitespace-nowrap" data-category="all">全部</button>
                <button onclick="filterByCategory('work')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap" data-category="work">工作</button>
                <button onclick="filterByCategory('study')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap" data-category="study">学习</button>
                <button onclick="filterByCategory('life')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap" data-category="life">生活</button>
  <button onclick="filterByCategory('sjapp')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap" data-category="sjapp">手机app</button>
 <button onclick="filterByCategory('sjk')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap" data-category="sjk">数据库</button>
                <button onclick="filterByCategory('other')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap" data-category="other">其他</button>
            </div>

            <!-- 搜索框 -->
            <div class="relative w-full md:w-64">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                </div>
                <input type="text" id="search-input" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition shadow-sm" placeholder="搜索标签或备注...">
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="mb-4 text-sm text-gray-500 flex justify-between items-center">
            <span id="stats-text">共找到 0 个标签</span>
            <span class="text-xs text-gray-400 italic">提示：点击标签内容可直接跳转链接</span>
        </div>

        <!-- 标签列表容器 -->
        <div id="tags-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态生成的内容将放在这里 -->
        </div>

        <!-- 空状态提示 -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                <i class="fa-regular fa-folder-open text-2xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900">暂无标签</h3>
            <p class="mt-1 text-gray-500">点击右上角“新建标签”开始整理你的知识碎片吧。</p>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p class="text-center md:text-left text-gray-500 text-sm mb-2 md:mb-0">
                    &copy; 2026 TagBox. All rights reserved.
                </p>
                <div class="flex items-center space-x-4 text-sm text-gray-600">
                    <span class="flex items-center">
                        <i class="fa-solid fa-calendar-days mr-1.5"></i> 
                        当前时间: <span id="current-time" class="font-semibold ml-1">--:--:--</span>
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <!-- 新建/编辑模态框 -->
    <div id="tag-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <!-- 背景遮罩 -->
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="closeModal()"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 sm:mx-0 sm:h-10 sm:w-10">
                            <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                        </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">新建标签</h3>
                            <div class="mt-4 space-y-4">
                                <!-- 内容输入 -->
                                <div>
                                    <label for="tag-content" class="block text-sm font-medium text-gray-700">标签内容 <span class="text-red-500">*</span></label>
                                    <input type="text" id="tag-content" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="例如：React官方文档">
                                </div>
                                
                                <!-- URL输入 (新增) -->
                                <div>
                                    <label for="tag-url" class="block text-sm font-medium text-gray-700">跳转链接 (可选)</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i class="fa-solid fa-link text-gray-400 text-xs"></i>
                                        </div>
                                        <input type="url" id="tag-url" class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-7 sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="https://example.com">
                                    </div>
                                    <p class="mt-1 text-xs text-gray-500">填写后点击标签内容即可直接跳转</p>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <!-- 分类选择 -->
                                    <div>
                                        <label for="tag-category" class="block text-sm font-medium text-gray-700">分类</label>
                                        <select id="tag-category" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
                                            <option value="work">工作</option>
                                            <option value="study">学习</option>
                                            <option value="life">生活</option>
                                            <option value="sjapp">软件</option>
                                           <option value="sjk">数据库</option>
                                            <option value="other">其他</option>
                                        </select>
                                    </div>
                                    <!-- 颜色选择 -->
                                    <div>
                                        <label for="tag-color" class="block text-sm font-medium text-gray-700">标记色</label>
                                        <div class="mt-1 flex items-center space-x-2">
                                            <input type="color" id="tag-color" class="h-9 w-9 rounded cursor-pointer border border-gray-300 p-0.5" value="#4F46E5">
                                            <span class="text-xs text-gray-500">点击色块修改</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- 备注 -->
                                <div>
                                    <label for="tag-note" class="block text-sm font-medium text-gray-700">备注说明</label>
                                    <textarea id="tag-note" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="添加一些额外的描述信息..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" onclick="saveTag()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
                        保存
                    </button>
                    <button type="button" onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-white border-l-4 border-green-400 shadow-lg rounded-md p-4 flex items-center min-w-[200px]">
            <i class="fa-solid fa-check-circle text-green-400 mr-3 text-lg"></i>
            <p id="toast-message" class="text-sm font-medium text-gray-800">操作成功</p>
        </div>
    </div>

    <!-- 引入 JS 逻辑 -->
    <script src="app.js"></script>
</body>
</html>
